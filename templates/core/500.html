{% extends 'base.html' %}

{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card-forensic p-5">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle-fill fs-1"></i>
            </div>
            <h2 class="h4 fw-bold">500 - Internal System Error</h2>
            <p class="text-muted mb-4">
                An unexpected technical error occurred while processing your request. Please contact your system administrator.
            </p>
            <div>
                <a href="{% url 'dashboard' %}" class="btn btn-primary">
                    <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
