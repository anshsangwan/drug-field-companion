{% extends 'base.html' %}

{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card-forensic p-5">
            <div class="text-danger mb-3">
                <i class="bi bi-shield-slash fs-1"></i>
            </div>
            <h2 class="h4 fw-bold">403 - Permission Denied</h2>
            <p class="text-muted mb-4">
                You do not possess the required authorization credentials or role privileges to perform this action or access this case dossier.
            </p>
            <div>
                <a href="{% url 'dashboard' %}" class="btn btn-primary">
                    <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
